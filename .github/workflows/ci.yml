name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite (Streamlit test must not be skipped)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -qi "skipped" pytest.log; then echo "::error::A test was skipped"; exit 1; fi
